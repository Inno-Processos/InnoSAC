version: '3.8'

services:
  sac:
    networks:
      -  proxy
    build: .
    container_name: sac
    restart: unless-stopped
    env_file: .env
    volumes: ["./data:/app/data"]
    labels:
      traefik.enable: 'true'
      traefik.docker.network: 'proxy'

      # --- Portal router: https:/innomaker.com.br ---
      traefik.http.routers.sac.rule: 'Host(`sac.innomaker.com.br`)'
      traefik.http.routers.sac.entrypoints: 'https'
      traefik.http.routers.sac.tls.certresolver: 'cloudflare'
      traefik.http.services.sac.loadbalancer.server.port: '3000'
      traefik.http.routers.sac.middlewares: 'authelia@docker'

    dns:
      - 192.168.0.201
      - 1.1.1.1
networks:
  proxy:
    external: true

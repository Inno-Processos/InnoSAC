services:
  # API e regras de negócio. Não fica exposto: só o frontend fala com ele, pela rede interna.
  backend:
    build: ./backend
    container_name: sac-backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATA_DIR: /data
      API_PORT: 3001
    volumes: ["./data:/data"]
    dns:
      - 192.168.0.201
      - 1.1.1.1

  # Interface web (landing page + SAC). É o que o Traefik publica em sac.innomaker.com.br.
  frontend:
    build: ./frontend
    container_name: sac
    restart: unless-stopped
    environment:
      API_URL: http://backend:3001
    depends_on: [backend]
    networks:
      - default
      - proxy
    labels:
      traefik.enable: 'true'
      traefik.docker.network: 'proxy'
      traefik.http.routers.sac.rule: 'Host(`sac.innomaker.com.br`)'
      traefik.http.routers.sac.entrypoints: 'https'
      traefik.http.routers.sac.tls.certresolver: 'cloudflare'
      traefik.http.services.sac.loadbalancer.server.port: '3000'

networks:
  proxy:
    external: true
